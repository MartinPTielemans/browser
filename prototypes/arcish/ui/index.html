<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="top">
        <div class="top-buttons">
          <button id="toggle" title="Toggle sidebar (⌘S)">
            <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" /><path d="M6 2.5v11" /></svg>
          </button>
          <span class="spacer"></span>
          <button id="back" title="Back (⌘[)"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg></button>
          <button id="forward" title="Forward (⌘])"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg></button>
          <button id="reload" title="Reload (⌘R)">
            <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6" /><path d="M12 1.5v3h-3" /></svg>
          </button>
        </div>
        <button id="url" class="urlbar" title="Edit URL (⌘L)"><span id="url-text"></span></button>
      </div>

      <section id="favorites" class="favgrid" data-section="favorites"></section>

      <div class="scroll">
        <div class="space-title"><span id="space-name" title="Double-click to rename"></span><span class="agent-pill">Agent</span></div>
        <div id="agent-bar" class="agent-bar">
          <span class="agent-light"></span><span id="agent-status" class="agent-status"></span>
          <button id="agent-control"></button>
        </div>
        <section id="pinned" class="list" data-section="pinned"></section>
        <div class="divider">
          <span class="line"></span>
          <button id="clear" title="Archive all unpinned tabs in this space">↓ Clear</button>
        </div>
        <button id="newtab" class="newtab"><span class="plus">+</span> New Tab</button>
        <section id="today" class="list" data-section="today"></section>
        <section id="activity" class="activity"></section>
      </div>

      <section id="inbox" class="inbox"></section>

      <footer>
        <div id="stats" class="stats"></div>
        <div class="spaces">
          <div id="space-dots" class="space-dots"></div>
          <button id="add-space" title="New space">+</button>
        </div>
      </footer>
    </aside>

    <div id="empty" class="empty">
      <div>
        <div id="empty-title" class="empty-title">Nothing open in this space</div>
        <div class="empty-hint"><kbd id="kbd-t">⌘T</kbd> new tab · <kbd>Ctrl 1–9</kbd> switch space</div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="sidebar.js"></script>
  </body>
</html>
