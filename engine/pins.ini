; Bumped together each Chromium release. The ungoogled-chromium-macos, -windows and
; ungoogled-chromium-portablelinux tags each name the ungoogled-chromium commit they build, and that
; names the Chromium version; setup.sh and linux/prepare.sh check both. A platform tag may build a
; later ungoogled-chromium commit than the tag, which fixes its patches. The Mac never waits for a
; point release: a platform whose tag lags stays on the Chromium its tag names, checked alone.
[chromium]
version = 156.0.8078.47

[ungoogled-chromium]
tag = 156.0.8078.47-1

[ungoogled-chromium-macos]
tag = 156.0.8078.47

[ungoogled-chromium-portablelinux]
tag = 156.0.8078.47-1

[ungoogled-chromium-windows]
tag = 156.0.8078.47-1.1

