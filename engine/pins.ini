; Bumped together each Chromium release. The ungoogled-chromium-macos, -windows and
; ungoogled-chromium-portablelinux tags each name the ungoogled-chromium commit they build, and that
; names the Chromium version; setup.sh and check-linux.sh check both. A platform tag may build a
; later ungoogled-chromium commit than the tag, which fixes its patches. Windows stays on the
; Chromium its own tag builds until it's bumped, and engine/windows/prepare.sh checks it alone.
