# ilo as a Flatpak: build/Browser, which `app/build.sh prod` makes, in /app/ilo. Cobalt starts it
# through zypak, which hands Chromium's sandbox to Flatpak's, as Flathub's Brave does; Chromium's
# own needs user namespaces, which a Flatpak can't make. tools/flatpak.sh builds the bundle.
app-id: app.ilo.browser
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '25.08'
command: ilo
separate-locales: false
build-options:
  no-debuginfo: true
# Each one, and those left out, is in the commit that added this file.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=cups
  - --filesystem=xdg-download
  - --persist=.pki
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  # Import from other browsers reads only these profile folders, read-only, copying each
  # database to a temporary file first, so a browser that's running keeps its own untouched.
  # Chrome, as installed, as a Flatpak.
  - --filesystem=xdg-config/google-chrome:ro
  - --filesystem=~/.var/app/com.google.Chrome/config/google-chrome:ro
  # Edge, as installed, as a Flatpak.
  - --filesystem=xdg-config/microsoft-edge:ro
  - --filesystem=~/.var/app/com.microsoft.Edge/config/microsoft-edge:ro
  # Brave, as installed, as a Flatpak, as a Snap (through its current revision).
  - --filesystem=xdg-config/BraveSoftware/Brave-Browser:ro
  - --filesystem=~/.var/app/com.brave.Browser/config/BraveSoftware/Brave-Browser:ro
  - --filesystem=~/snap/brave/current/.config/BraveSoftware/Brave-Browser:ro
  # Vivaldi, as installed, as a Flatpak, as a Snap.
  - --filesystem=xdg-config/vivaldi:ro
  - --filesystem=~/.var/app/com.vivaldi.Vivaldi/config/vivaldi:ro
  - --filesystem=~/snap/vivaldi/current/.config/vivaldi:ro
  # Opera, as installed, as a Flatpak, as a Snap.
  - --filesystem=xdg-config/opera:ro
  - --filesystem=~/.var/app/com.opera.Opera/config/opera:ro
  - --filesystem=~/snap/opera/current/.config/opera:ro
  # Chromium, as installed, as a Flatpak, ungoogled-chromium's Flatpak, as a Snap.
  - --filesystem=xdg-config/chromium:ro
  - --filesystem=~/.var/app/org.chromium.Chromium/config/chromium:ro
  - --filesystem=~/.var/app/io.github.ungoogled_software.ungoogled_chromium/config/chromium:ro
  - --filesystem=~/snap/chromium/common/chromium:ro
  # Helium.
  - --filesystem=xdg-config/net.imput.helium:ro
  # Firefox in ~/.mozilla and, from 147, ~/.config/mozilla; as a Flatpak, as a Snap.
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=xdg-config/mozilla/firefox:ro
  - --filesystem=~/.var/app/org.mozilla.firefox/.mozilla/firefox:ro
  - --filesystem=~/.var/app/org.mozilla.firefox/config/mozilla/firefox:ro
  - --filesystem=~/snap/firefox/common/.mozilla/firefox:ro
  # Zen, in its old folder and its new, as a Flatpak.
  - --filesystem=~/.zen:ro
  - --filesystem=xdg-config/zen:ro
  - --filesystem=~/.var/app/app.zen_browser.zen/.zen:ro
  - --filesystem=~/.var/app/app.zen_browser.zen/config/zen:ro
  # LibreWolf, in its old folder and its new, as a Flatpak.
  - --filesystem=~/.librewolf:ro
  - --filesystem=xdg-config/librewolf/librewolf:ro
  - --filesystem=~/.var/app/io.gitlab.librewolf-community/.librewolf:ro
modules:
  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53

  - name: ilo
    buildsystem: simple
    build-commands:
      - cp -a Browser /app/ilo
      - install -Dm755 ilo.sh /app/bin/ilo
      - install -Dm644 -t /app/etc cobalt.ini
      - install -Dm644 -t /app/share/applications app.ilo.browser.desktop
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps app.ilo.browser.svg
      - install -Dm644 -t /app/share/metainfo app.ilo.browser.metainfo.xml
    sources:
      - type: dir
        path: ../../../build/Browser
        dest: Browser
      - type: file
        path: ilo.sh
      - type: file
        path: cobalt.ini
      - type: file
        path: app.ilo.browser.desktop
      - type: file
        path: app.ilo.browser.svg
      - type: file
        path: app.ilo.browser.metainfo.xml
