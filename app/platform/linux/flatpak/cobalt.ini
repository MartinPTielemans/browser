# Cobalt (github.com/refi64/cobalt), from org.chromium.Chromium.BaseApp, starts ilo: its user flags
# from ~/.var/app/app.ilo.browser/config/ilo-flags.conf, then chrome through zypak.
[Application]
Name=ilo
EntryPoint=/app/ilo/chrome
WrapperScript=/app/bin/ilo
# The profile, under the Flatpak's XDG_CONFIG_HOME (main.rs, profile_dir).
ConfigDir=ilo

[Zypak]
Enabled=true
# The engine ships no setuid sandbox; zypak answers for the name chrome looks for.
SandboxFilename=chrome-sandbox
# The opt-in Widevine (#236) downloads into the profile's WidevineCdm, which the sandboxed
# processes need to see.
ExposeWidevine=true
