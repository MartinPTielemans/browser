<!-- The Library's Spaces section (ours): two cards, the one behind turned and the one in front solid. Drawn in points on Lucide's 24 grid and stroke. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="11" height="14" x="2.5" y="3.5" rx="2.5" transform="rotate(-12 8 10.5)" />
  <rect width="11" height="14" x="10.5" y="6.5" rx="2.5" fill="currentColor" />
</svg>
