; uBlock Origin, the ad blocker the browser comes with (docs/ux-spec.md › Ad blocking): upstream's
; Chromium build, GPL-3.0 (see NOTICE). fetch-ublock.sh downloads it, checks it, adds the key and
; changes the timers that would wake an idle browser, and build.sh puts it in the framework's
; resources, where the core loads it into every profile. Bump the version, url and sha256 together,
; with each uBlock Origin release; fetch-ublock.sh fails if a line it changes has moved.
[ublock]
version = 1.75.0
url = https://github.com/gorhill/uBlock/releases/download/1.75.0/uBlock0_1.75.0.chromium.zip
sha256 = 393cf95709d1074d4022970e9014e434395c53a822387f1e25f43be97cf4b582
; Our public key, which gives it the same id wherever the app is (core/ad_block.cc's kId). No one
; signs with it: an extension loaded from a folder only takes its id from it.
key = 
