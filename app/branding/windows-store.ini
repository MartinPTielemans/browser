; The Microsoft Store's identity for ilo's MSIX, as Partner Center gives it once the app's name is
; reserved there: Apps and games › ilo › Product management › Product identity. Package/Identity/Name,
; Package/Identity/Publisher and Package/Properties/PublisherDisplayName go here as Partner Center
; shows them. Until then each holds a placeholder: app/platform/windows/package/package.sh builds a
; test MSIX with them, which the Store would refuse, and stops on one with --release.
[store]
identity-name = PLACEHOLDER-Partner-Center-Package-Identity-Name
publisher = CN=PLACEHOLDER-Partner-Center-Package-Identity-Publisher
publisher-display-name = PLACEHOLDER Partner Center Publisher display name
