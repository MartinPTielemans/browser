[radius]
# ilo's four corner radii (ours, #315), and the rule that joins them: a corner nested inside
# another is concentric, so the inner radius is the outer one less the inset between them. Every
# other `radius` key in this file holds one of these, or is derived by that rule, or is the shape
# of a beak, a glyph or a pill (half its height). tokens/tests.rs holds the file to it.
# Buttons, chips, the find bar, the header's plates.
