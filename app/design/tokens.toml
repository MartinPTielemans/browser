[shell.onboarding]
# A new profile's first launch (docs/ux-spec.md › Onboarding): the brand's ground over the whole
# window, Paper in a light appearance and Ink in a dark one, with the other drawing on it, and the
# Signal green only on the wordmark's dot and the one button.
