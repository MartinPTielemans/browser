# ilo's look: colours, radii, type, elevation, state alphas, and the spacing and sizes that belong
# to it. The code and the design file share these values. build.rs turns them into
# `crate::tokens`, and tools/design-sync.md takes them to the design file and back.
#
# A table holds one surface's tokens and is named after its module, so `[shell.library]` becomes
# `tokens::shell::library`, which `shell::library` re-exports. A key is its constant's name in
# kebab-case. An integer is a `u32`, written in hex when it's a colour: six digits for `rgb`, eight
# for `rgba`. A float is an `f32`, so a whole one keeps its `.0`. A one-line array of either is an
# array. Comments right above a key become its docs.
#
# Timings, springs and other motion stay in the code: the design file has no motion.

