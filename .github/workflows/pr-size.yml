# Labels each pull request with its size in changed lines, tests left out unless the pull request is
# only tests. Adapted from T3 Code (https://github.com/pingdotgg/t3code, MIT) at commit
# 570d4b03eef879bd60be3d74444046858c94dacd.
#
# It runs on pull_request_target and reads the diff's line counts from the API, so it never checks
# out or runs the pull request's code.
name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions: {}

jobs:
  label:
    name: Label PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # labels.yml keeps the labels' colors and descriptions.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issueNumber = context.payload.pull_request.number;
            // The UI's tests, the app's checks and Chromium-style C++ tests.
            const isTest = (file) =>
              /(^|\/)tests?\//.test(file) ||
              /(^|\/)(tests|[^/]+_tests)\.rs$/.test(file) ||
              /_(unit|browser)?tests?\.(cc|mm|h)$/.test(file) ||
              /^app\/check(\.sh$|\/)/.test(file);
            const sizes = [
              [10, "size:XS"],
              [30, "size:S"],
              [100, "size:M"],
              [500, "size:L"],
              [1000, "size:XL"],
              [Infinity, "size:XXL"],
            ];
            const managed = sizes.map(([, name]) => name);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
              per_page: 100,
            });
            let code = 0;
            let tests = 0;
            for (const file of files) {
              const lines = file.additions + file.deletions;
              if (isTest(file.filename)) tests += lines;
              else code += lines;
            }
            const counted = code === 0 ? tests : code;
            const next = sizes.find(([limit]) => counted < limit)[1];

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            for (const label of current) {
              if (!managed.includes(label.name) || label.name === next) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!current.some((label) => label.name === next)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [next],
              });
            }
            core.info(`PR #${issueNumber}: ${code} lines, ${tests} test lines -> ${next}`);
