# The Windows packages for a release (#454), as the run's `windows-packages` artifact: the MSIX for
# the Microsoft Store and the per-user installer for winget, both unsigned for 0.1.0
# (app/platform/windows/package/package.sh), with winget's manifests for that installer, and a new
# user's first run on that installer, as the artifact first-run. Built from
# Browser.dll and the newest Windows engine release in the commit's history, which
# engine-windows-cross.yml publishes. Without one there is Browser.dll alone, linked against the
# core's API, to try the packaging: what it packs doesn't run, and the run's summary says so.
# GitHub's hosted runners only, by hand or on a push that changes the packaging, never on a pull
# request.
name: Windows packages

on:
  workflow_dispatch:
  # Branches only: an engine release's tag, pushed with the owner's token, starts nothing here.
  push:
    branches: ['**']
    paths:
      - app/platform/windows/package/**
      - app/branding/windows-store.ini
      - app/branding/winget.ini
      - app/fetch-ublock.sh
      - app/ublock.ini
      - tools/winget.sh
      - tools/licences.sh
      - tools/third-party.py
      - app/check/first-run.sh
      - .github/workflows/package-windows.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      # setup.sh and the patches it applies need the repository's line endings.
      - run: git config --global core.autocrlf false
        working-directory: .
      # With its history, where fetch.sh finds the engine release nearest the commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: rustup update stable --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/windows/target
          key: package-windows-${{ hashFiles('app/Cargo.lock', 'app/windows/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: package-windows-

      - run: ./setup.sh

      # Browser.dll links chrome.dll's import library. Without an engine, one made from the core's
      # API (core/public/browser_core.h) stands in for it.
      - name: Engine
        run: |
          if [ -f .deps/engine/chrome.exe ]; then
            echo "Engine: $(cat .deps/engine/.from)" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p .deps/engine
          {
            echo "LIBRARY chrome.dll"
            echo "EXPORTS"
            grep -o 'BC_EXPORT[^(]*\bbc_[a-z0-9_]*(' ../core/public/browser_core.h |
              sed -E 's/.*\b(bc_[a-z0-9_]+)\($/\1/'
          } >.deps/engine/chrome.def
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          lib=$("$vswhere" -latest -products '*' -find 'VC/Tools/MSVC/*/bin/Hostx64/x64/lib.exe' | head -1 | tr -d '\r')
          MSYS2_ARG_CONV_EXCL='*' "$(cygpath -u "$lib")" /nologo /machine:x64 \
            "/def:$(cygpath -w .deps/engine/chrome.def)" "/out:$(cygpath -w .deps/engine/chrome.dll.lib)"
          echo "No Windows engine release in this commit's history: Browser.dll is linked against the core's API and packed alone, and neither package runs." >>"$GITHUB_STEP_SUMMARY"

      - name: Browser.dll
        working-directory: app/windows
        run: |
          cargo build --release --features prod
          # The bridge an agent's MCP client runs, which package.sh puts beside Browser.dll.
          cargo build --release --features prod --manifest-path ../Cargo.toml --bin mcp-bridge --target-dir target

      - name: Inno Setup
        run: |
          [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress

      - name: Package
        run: |
          platform/windows/package/package.sh "$RUNNER_TEMP/windows-packages" | tee -a "$GITHUB_STEP_SUMMARY"

      # For the installer a release at tag v<version> would publish. Not for Browser.dll alone.
      - name: winget manifests
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          installer=$RUNNER_TEMP/windows-packages/$(cat branding/name)-$version-x64-setup.exe
          if [ ! -f "$installer" ]; then
            echo "No winget manifests: the installer packs Browser.dll alone." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ../tools/winget.sh "$installer" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/ilo-windows-x64-setup.exe" \
            "$RUNNER_TEMP/windows-packages/winget"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: ${{ runner.temp }}/windows-packages
          if-no-files-found: error

      # A new user's first run on the installer just built, as release.yml's try builds it: it
      # installs, plays the onboarding, opens a page, quits, comes back with its tab and uninstalls
      # (check/first-run.sh), on a 1920 by 1080 screen as Check on Windows has. Last, so a failing
      # first run keeps the packages, and not for Browser.dll alone, which doesn't run.
      - name: First run
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          installer=$RUNNER_TEMP/windows-packages/$(cat branding/name)-$version-x64-setup.exe
          if [ ! -f "$installer" ]; then
            echo "No first run: the installer packs Browser.dll alone." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          powershell.exe -NoProfile -NonInteractive -Command 'Set-DisplayResolution -Width 1920 -Height 1080 -Force'
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          chmod +x "$RUNNER_TEMP/bin/python3"
          status=0
          PATH=$RUNNER_TEMP/bin:$PATH BROWSER_INSTALLER=$installer timeout 20m ./check.sh first-run || status=$?
          mkdir -p "$RUNNER_TEMP/first-run"
          cp -r build/check/. "$RUNNER_TEMP/first-run/" || true
          if [ "$status" = 0 ]; then
            echo "First run: passed." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "First run: failed ($status). Its logs and captures are in the artifact first-run." >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: first-run
          path: ${{ runner.temp }}/first-run
          if-no-files-found: ignore
