# The browser on the Mac, run and checked by app/check.sh (AGENTS.md, Verifying), on the Mac engine
# built from this commit's core, on GitHub's hosted Apple silicon runners. Runs by hand, and on
# pushes to ci/mac-check while it's tried: never a pull request, and never the self-hosted runner.
# A commit whose core/public/browser_core.h no published engine has is skipped, as nothing can run
# it. Every run in app/check/ shows in the summary: passed, failed, or skipped and why.
#
# The probe job asks the runner what the checks need, without the app: a Metal device, a GUI
# session, whether a window shows and can be captured, and whether an app can be made active, with
# the prebuilt Chromium alone and GPUI's preview. It holds nothing of the owner's.
name: Check on macOS

on:
  push:
    branches: [ci/mac-check]
    paths-ignore: ['**/*.md', docs/**]
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs", or "all"; empty for load and tabs
        default: ''
      ref:
        description: The commit to check, whose app and core are built; empty for the one dispatched
        default: ''
      probe:
        description: Also ask the runner what the checks need, without the app
        type: boolean
        default: true

concurrency:
  group: check-mac-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      # The runs tried on the hosted runner so far: one without the driver and one with it.
      MAC_RUNS: load tabs
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - id: engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            echo "::notice::No Mac engine fits this commit, so nothing is built or checked. $why"
            printf 'Skipped: no Mac engine fits this commit, so nothing is built or checked.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: rustup update stable --no-self-update

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-mac-${{ hashFiles('app/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: check-mac-

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: ./setup.sh prebuilt && ./build.sh

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out"
          # check.sh's own list, the runs it does with no names and the ones it does only when named.
          all=$(sed -n 's/^runs="\(\$runs \)\{0,1\}\(.*\)"$/\2/p; s/^named="\(.*\)"$/\1/p' check.sh | tr '\n' ' ')
          case $RUNS in
          '') runs=$MAC_RUNS ;;
          all) runs=$all ;;
          *) runs=$RUNS ;;
          esac
          {
            echo "| Run | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # GNU's timeout, which macOS doesn't have under that name, if the runner has it.
          limit=$(command -v timeout || command -v gtimeout || true)
          failed=0
          for run in $all; do
            case " $runs " in
            *" $run "*)
              start=$SECONDS
              status=0
              ${limit:+$limit 20m} ./check.sh "$run" > "$out/$run.log" 2>&1 || status=$?
              [ ! -d build/check ] || mv build/check "$out/$run"
              pkill -9 -f "$PWD/build/Browser.app/" || true
              if [ "$status" = 0 ]; then
                # check.sh says so when the app couldn't be made active and the driven checks
                # didn't run.
                result="passed in $((SECONDS - start)) s$(grep -qi 'skip' "$out/$run.log" && echo ', with skips: see its log')"
              else
                result="failed ($status): $(grep -m1 '^FAIL' "$out/$run.log" | cut -c7- | tr '|' '/')"
                failed=1
                echo "::error::The $run run failed. Its log: $run.log in the artifact."
              fi
              ;;
            *) result="skipped: not tried on the hosted runner yet" ;;
            esac
            echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: check-mac
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore

  # The one pair of GPUI and the core the prebuilt Mac engine fits, from before the app: the
  # gpui-core spike at the commit after the engine's, with its own driven check. Its load, focus and
  # keys, scrolling with frame times, full screen and popup runs stand in for the app's.
  spike:
    if: ${{ github.event_name == 'push' || inputs.probe }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spikes/gpui-core
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55225564da39411b096fb571d967221afd315420
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            spikes/gpui-core/target
          key: spike-mac-${{ hashFiles('spikes/gpui-core/Cargo.lock', 'spikes/gpui-core/patches/**') }}

      - run: rustup update stable --no-self-update && ./setup.sh prebuilt && ./build.sh

      - run: |
          status=0
          # GNU's timeout, which macOS doesn't have under that name, if the runner has it.
          limit=$(command -v timeout || command -v gtimeout || true)
          ${limit:+$limit 20m} ./check.sh 2>&1 | tee check.log || status=$?
          mkdir -p build/check
          mv check.log build/check/
          pkill -9 -f "$PWD/build/Spike.app/" || true
          {
            echo '```'
            grep -E '^(ok|skip|FAIL)|^  ' build/check/check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: spike-mac
          path: spikes/gpui-core/build/check
          if-no-files-found: ignore

  probe:
    if: ${{ github.event_name == 'push' || inputs.probe }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The runner
        run: |
          OUT=$RUNNER_TEMP/probe
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          {
            sw_vers
            uname -m
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
            system_profiler SPDisplaysDataType
            who
          } 2>&1 | tee "$OUT/runner.txt"
          swift - << 'SWIFT' 2>&1 | tee "$OUT/session.txt"
          import AppKit
          import Metal
          print("metal devices: \(MTLCopyAllDevices().map { $0.name })")
          if let device = MTLCreateSystemDefaultDevice() {
            print("metal default: \(device.name), apple7: \(device.supportsFamily(.apple7)), unified memory: \(device.hasUnifiedMemory)")
          } else {
            print("metal default: none")
          }
          print("session: \(CGSessionCopyCurrentDictionary() as? [String: Any] ?? [:])")
          print("screens: \(NSScreen.screens.map { "\($0.localizedName) \($0.frame) at \($0.backingScaleFactor)x" })")
          print("screen capture allowed: \(CGPreflightScreenCaptureAccess())")
          print("frontmost: \(NSWorkspace.shared.frontmostApplication.map { "\($0.localizedName ?? "?") \($0.processIdentifier)" } ?? "none")")
          SWIFT

      # Swift's own helpers for what follows: which app is frontmost, and asking for one to be.
      - name: The helpers
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/frontmost.swift" << 'SWIFT'
          import AppKit
          let pid = Int32(CommandLine.arguments[1])!
          let before = NSWorkspace.shared.frontmostApplication?.processIdentifier ?? 0
          let app = NSRunningApplication(processIdentifier: pid)
          let asked = app?.activate(options: [.activateAllWindows]) ?? false
          RunLoop.current.run(until: Date().addingTimeInterval(2))
          let after = NSWorkspace.shared.frontmostApplication?.processIdentifier ?? 0
          print("pid \(pid): frontmost before \(before == pid), activate asked \(asked), frontmost after \(after == pid), active \(app?.isActive ?? false)")
          SWIFT
          swiftc -O -o "$RUNNER_TEMP/bin/frontmost" "$RUNNER_TEMP/frontmost.swift"

      # The prebuilt engine prebuilt.ini names, by itself: Chromium's own executable and its own
      # window, on chrome://gpu, which says what Chromium draws with here.
      - name: Chromium
        run: |
          url=$(git config -f engine/prebuilt.ini prebuilt.url)
          sha256=$(git config -f engine/prebuilt.ini prebuilt.sha256)
          curl -fsSL -o "$RUNNER_TEMP/engine.tar.xz" "$url"
          echo "$sha256  $RUNNER_TEMP/engine.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/engine"
          tar -xf "$RUNNER_TEMP/engine.tar.xz" -C "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/Chromium.app/Contents/MacOS/Chromium" --user-data-dir="$RUNNER_TEMP/chromium-profile" \
            --use-mock-keychain --no-first-run --no-default-browser-check --enable-logging=stderr \
            chrome://gpu > "$OUT/chromium.log" 2>&1 &
          pid=$!
          # A probe, not a check: it gives Chromium time to start, then looks.
          sleep 20
          kill -0 "$pid" && echo "Chromium is running" || echo "Chromium exited"
          "$RUNNER_TEMP/bin/frontmost" "$pid" | tee "$OUT/chromium-active.txt" || true
          tools/window-screenshot.sh "$pid" "$OUT/chromium-window.png" ||
            echo "no window capture for Chromium" | tee -a "$OUT/chromium-active.txt"
          screencapture -x "$OUT/chromium-screen.png" || echo "no screen capture"
          kill "$pid" || true
          sleep 3
          pkill -9 -f "$RUNNER_TEMP/engine/" || true

      # GPUI's own window, with Metal, on the app's preview, which needs no engine. setup.sh fails
      # once it gets to the engine, which no commit of the app fits yet, after the crates it patches.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: probe-mac-${{ hashFiles('app/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: probe-mac-

      - name: GPUI's preview
        working-directory: app
        run: |
          rustup update stable --no-self-update
          ./setup.sh prebuilt || echo "setup.sh stopped at the engine"
          start=$SECONDS
          cargo build --release --bin preview
          echo "preview built in $((SECONDS - start)) s" | tee "$OUT/preview-active.txt"
          BROWSER_DISPLAY=main target/release/preview > "$OUT/preview.log" 2>&1 &
          pid=$!
          sleep 15
          kill -0 "$pid" && echo "the preview is running" || echo "the preview exited"
          "$RUNNER_TEMP/bin/frontmost" "$pid" | tee -a "$OUT/preview-active.txt" || true
          ../tools/window-screenshot.sh "$pid" "$OUT/preview-window.png" ||
            echo "no window capture for the preview" | tee -a "$OUT/preview-active.txt"
          screencapture -x "$OUT/preview-screen.png" || echo "no screen capture"
          kill "$pid" || true

      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-mac
          path: ${{ runner.temp }}/probe
          if-no-files-found: ignore
