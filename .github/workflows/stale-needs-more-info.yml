# Closes an issue 7 days after a maintainer labels it "needs more info", unless the reporter
# answers. Adapted from T3 Code (https://github.com/pingdotgg/t3code, MIT) at commit
# 570d4b03eef879bd60be3d74444046858c94dacd.
name: Close stale "needs more info" issues

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # actions/stale keeps its progress in the Actions cache.
      actions: write
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: "needs more info"
          # A maintainer applies the label, so never mark an issue stale; close 7 days after the label.
          days-before-issue-stale: -1
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          stale-issue-label: "needs more info"
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no reply in 7 days after we asked for more information.
            Comment with the missing details and we will reopen.
          operations-per-run: 200
