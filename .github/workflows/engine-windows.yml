# The engine on Windows: ungoogled-chromium-windows's build with the core and our series
# (engine/windows/prepare.sh). Run by hand only, while Windows stays on an earlier Chromium than the
# series: it builds chrome.dll and chrome.exe, the engine the Windows app runs on, and leaves them as
# the run's `chromium` artifact, or with core_only compiles only the core's own files.
# A runner has 6 hours, and the build takes longer, so it runs in stages that each build for 3.5
# hours and hand the tree to the next as an artifact, as ungoogled-chromium-windows's CI does.
name: Engine on Windows

on:
  workflow_dispatch:
    inputs:
      core_only:
        description: Compile only the core's own files
        type: boolean
        default: false

concurrency:
  group: engine-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  ILO_CORE_ONLY: ${{ inputs.core_only && '1' || '' }}
  ILO_BASH: C:\Program Files\Git\bin\bash.exe

jobs:
  build-1:
    runs-on: windows-2022
    outputs: &outputs
      finished: ${{ steps.stage.outputs.finished || join(needs.*.outputs.finished) }}
    steps: &steps
      - uses: actions/checkout@v4
        if: join(needs.*.outputs.finished) != 'true'
      - uses: actions/setup-python@v5
        if: join(needs.*.outputs.finished) != 'true'
        with:
          python-version: '3.12'
      - name: Prepare
        if: join(needs.*.outputs.finished) != 'true'
        shell: bash
        run: |
          engine/windows/prepare.sh /c/ungoogled-chromium-windows
          echo "ILO_ENGINE=$(cygpath -m "$PWD/engine")" >> "$GITHUB_ENV"
      # The SDK ungoogled-chromium-windows builds with, which the runner lacks.
      - name: Install Windows SDK 10.0.28000.0
        if: join(needs.*.outputs.finished) != 'true'
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0') { exit 0 }
          $installer = "$env:TEMP\winsdksetup.exe"
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList '/features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.DesktopCPPArm64 OptionId.WindowsDesktopDebuggers OptionId.UWPCPP OptionId.SigningTools /q /norestart /ceip off' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "winsdksetup.exe failed with code $($proc.ExitCode)" }
      - name: Set up the stage
        if: join(needs.*.outputs.finished) != 'true'
        working-directory: .github/actions/engine-windows-stage
        run: npm install
      - name: Build
        id: stage
        if: join(needs.*.outputs.finished) != 'true'
        uses: ./.github/actions/engine-windows-stage
        with:
          finished: false
          from_artifact: ${{ toJSON(needs) != '{}' }}
  build-2:
    needs: build-1
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-3:
    needs: build-2
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-4:
    needs: build-3
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-5:
    needs: build-4
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-6:
    needs: build-5
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-7:
    needs: build-6
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-8:
    needs: build-7
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-9:
    needs: build-8
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-10:
    needs: build-9
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-11:
    needs: build-10
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-12:
    needs: build-11
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-13:
    needs: build-12
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-14:
    needs: build-13
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-15:
    needs: build-14
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  build-16:
    needs: build-15
    runs-on: windows-2022
    outputs: *outputs
    steps: *steps
  complete:
    needs: build-16
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the build finished
        run: '[ "${{ needs.build-16.outputs.finished }}" = true ] || { echo "The build did not finish in 16 stages."; exit 1; }'
