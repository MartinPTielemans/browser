# ilo's Flatpak (tools/flatpak.sh) from the prod build on the prebuilt Linux engine, as an artifact,
# then installed and started on X11 in Xvfb to see that its first window draws.
# Run it by hand to build from a branch whose packaging didn't change. release.yml calls it for a
# release's Flatpak, the `ilo-flatpak` artifact, and its crash reports' symbols.
# A push or a run by hand whose core/public/browser_core.h no published Linux engine has is
# skipped, as nothing can run it, as check-linux.yml skips it (#882). A release fails instead: it
# needs its commit's engine.
name: Flatpak

on:
  # Branches only: an engine release's tag, pushed with the owner's token, starts nothing here.
  push:
    branches: ['**']
    paths: [app/platform/linux/flatpak/**, tools/flatpak.sh, .github/workflows/flatpak.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: A release's bundle, which fails rather than skips without its engine
        type: boolean
        default: true
      symbols:
        description: Upload the bundle's crash reports' symbols (tools/symbols.sh)
        type: boolean
        default: false
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # engine/fetch.sh finds the engine from the history's tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: engine
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          status=0
          engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            if [ "$RELEASE" = true ]; then
              echo "::error::No Linux engine fits this commit, so the release has no Flatpak. $why"
              exit 1
            fi
            echo "::notice::No Linux engine fits this commit, so no Flatpak is built. $why"
            printf 'Skipped: no Linux engine fits this commit, so no Flatpak is built.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

      # The UI's build as in app-linux.yml; Xvfb and ImageMagick to start the bundle and see it.
      - name: Install tools
        if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libclang-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev flatpak flatpak-builder xvfb imagemagick
          rustup update stable --no-self-update
          # Ubuntu's AppArmor keeps bubblewrap, which flatpak builds and runs in, from making
          # user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: flatpak-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: flatpak-

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: tools/flatpak.sh

      # The engine's and the app's files as the bundle has them: its build strips nothing
      # (no-debuginfo), so chrome and libBrowser.so keep their symbol tables.
      - name: Crash reports' symbols
        if: ${{ inputs.symbols && steps.engine.outputs.found == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: tools/symbols.sh app/build/Browser

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ilo-flatpak
          path: app/build/ilo.flatpak
          retention-days: 14

      - name: Install and start
        if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          flatpak install --user -y --noninteractive app/build/ilo.flatpak
          mkdir -p app/build/flatpak-start
          cd app/build/flatpak-start
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            flatpak run app.ilo.browser > ilo.log 2>&1 &
            pid=$!
            for _ in $(seq 120); do
              grep -q "browser: UI shown" ilo.log && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            import -window root started.png || true
            flatpak kill app.ilo.browser || true
            wait $pid || true'
          cat ilo.log
          grep -q "browser: UI shown" ilo.log

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.engine.outputs.found == 'true' }}
        with:
          name: ilo-flatpak-start
          path: app/build/flatpak-start
          if-no-files-found: ignore
