# The browser on Linux, run and checked by app/check.sh (AGENTS.md, Verifying) under Xvfb and
# openbox, on X11, on the Linux engine built from this commit's core: the safety net for what the
# Mac and Linux share. Main's pushes and runs by hand only, on GitHub's hosted runners: never a
# pull request, and never the self-hosted runner, which builds the engine. It never builds an
# engine: it takes the newest engine-linux release in this commit's history (engine/fetch.sh), and
# a commit whose core/public/browser_core.h no published engine has is skipped, as nothing can run
# it. Every run in app/check/ shows in the summary: passed, failed, or skipped and why, with the
# lines a run that passed skipped. Failures fail the job, which nothing waits on yet.
name: Check on Linux

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', docs/**]
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs", or "all"; empty for the ones Linux passes
        default: ''

concurrency:
  group: check-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      # The runs that pass on X11 so far.
      LINUX_RUNS: tabs window find agents spaces crash profiles private quit mcp appearance onboarding
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            echo "::notice::No Linux engine fits this commit, so nothing is built or checked. $why"
            printf 'Skipped: no Linux engine fits this commit, so nothing is built or checked.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

      # bindgen reads the core's header with libclang; GPUI links xcb and xkbcommon, and draws with
      # Vulkan, which the GPU-less runner has in Mesa's software driver, lavapipe. check.sh runs
      # the app under Xvfb and openbox (BROWSER_XVFB), captures it with ImageMagick's import and
      # reads pixels with ImageMagick, whose `magick` Ubuntu's 6.9 calls `convert`. Ubuntu's
      # AppArmor denies Chromium's sandbox the user namespaces it needs, so the runner allows them,
      # and the sandbox stays on.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -yq libclang-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 mesa-vulkan-drivers libegl1 \
            libgl1-mesa-dri xvfb xauth openbox imagemagick
          rustup update stable --no-self-update
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec convert "$@"\n' > "$RUNNER_TEMP/bin/magick"
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: |
            check-linux-
            app-linux-

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: ./setup.sh && ./build.sh

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          RUNS: ${{ inputs.runs }}
          BROWSER_XVFB: 1
          # The runner's C.UTF-8 names no country, for which Chromium's search engines leave out
          # DuckDuckGo, the one the core picks, so the command bar would offer no search.
          LANG: en_US.UTF-8
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out"
          # check.sh's own list, the runs it does with no names and the ones it does only when named.
          all=$(sed -n 's/^runs="\(\$runs \)\{0,1\}\(.*\)"$/\2/p; s/^named="\(.*\)"$/\1/p' check.sh | tr '\n' ' ')
          case $RUNS in
          '') runs=$LINUX_RUNS ;;
          all) runs=$all ;;
          *) runs=$RUNS ;;
          esac
          {
            echo "Under Xvfb and openbox, on X11."
            echo
            echo "| Run | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for run in $all; do
            case " $runs " in
            *" $run "*)
              start=$SECONDS
              status=0
              timeout 20m ./check.sh "$run" > "$out/$run.log" 2>&1 || status=$?
              [ ! -d build/check ] || mv build/check "$out/$run"
              pkill -9 -f "$PWD/build/Browser/" || true
              # A run that passes may have skipped steps, or all of itself, such as when the app
              # wasn't the active one.
              skipped=$(grep '^skip: ' "$out/$run.log" | cut -c7- | tr '|\n' '/;' | sed 's/;$//')
              if [ "$status" = 0 ]; then
                result="passed in $((SECONDS - start)) s${skipped:+, skipping: $skipped}"
              else
                result="failed ($status): $(grep -m1 '^FAIL' "$out/$run.log" | cut -c7- | tr '|' '/')"
                failed=1
                echo "::error::The $run run failed. Its log: $run.log in the artifact."
              fi
              ;;
            *) result="skipped: not in the runs Linux passes yet" ;;
            esac
            echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
