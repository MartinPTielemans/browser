# The browser on Linux, run and checked by app/check.sh (AGENTS.md, Verifying), on the Linux engine
# built from this commit's core. Main's pushes and runs by hand only, on GitHub's hosted runners:
# never a pull request, which could reach the self-hosted runner that builds the engine. A commit
# whose core/public/browser_core.h no published engine has is skipped, as nothing can run it.
# Every run in app/check/ shows in the summary: passed, failed, or skipped and why.
name: Check on Linux

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', docs/**]
  workflow_dispatch:
    inputs:
      runs:
        description: The runs to do, such as "load tabs", or "all"; empty for the ones Linux passes
        default: ''

concurrency:
  group: check-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      # The driven runs that pass on Linux so far, beside the runs that need no driver, which always
      # run, and why each other can't yet.
      LINUX_RUNS: ''
      LINUX_SKIPS: |
        quit: a quit on Linux crashes until #474's fix is in the engine
    steps:
      # With the history, where fetch.sh looks for the engine's commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: engine
        run: |
          status=0
          ../engine/fetch.sh > /dev/null 2> "$RUNNER_TEMP/fetch.log" || status=$?
          cat "$RUNNER_TEMP/fetch.log" >&2
          case $status in
          0) echo "found=true" >> "$GITHUB_OUTPUT" ;;
          2)
            why=$(tail -1 "$RUNNER_TEMP/fetch.log")
            echo "::notice::No Linux engine fits this commit, so nothing is built or checked. $why"
            printf 'Skipped: no Linux engine fits this commit, so nothing is built or checked.\n\n%s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            ;;
          *) exit "$status" ;;
          esac

      # bindgen reads the core's header with libclang; GPUI links xcb and xkbcommon, and draws with
      # Vulkan, which the GPU-less runner has in Mesa's software driver, lavapipe. check.sh runs
      # the app in a headless sway session on its Xwayland (tools/headless.sh), captures it with grim
      # and reads pixels with ImageMagick, whose `magick` Ubuntu's 6.9 calls `convert`. Ubuntu's
      # AppArmor denies Chromium's sandbox the user namespaces it needs, so the runner allows them,
      # and the sandbox stays on.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -q
          sudo apt-get install -yq libclang-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 mesa-vulkan-drivers libegl1 \
            libgl1-mesa-dri sway xwayland grim imagemagick
          rustup update stable --no-self-update
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec convert "$@"\n' > "$RUNNER_TEMP/bin/magick"
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - if: ${{ steps.engine.outputs.found == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: check-linux-${{ hashFiles('app/Cargo.lock', 'app/linux/Cargo.lock', 'app/setup.sh', 'app/patches/**') }}
          restore-keys: |
            check-linux-
            app-linux-

      - if: ${{ steps.engine.outputs.found == 'true' }}
        run: ./setup.sh && ./build.sh

      # Each run alone, so one failing doesn't hide the rest, and each keeps its own build/check.
      - if: ${{ steps.engine.outputs.found == 'true' }}
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          out=$RUNNER_TEMP/check
          mkdir -p "$out"
          # check.sh's own list, the runs it does with no names and the ones it does only when named.
          all=$(sed -n 's/^runs="\(\$runs \)\{0,1\}\(.*\)"$/\2/p; s/^named="\(.*\)"$/\1/p' check.sh | tr '\n' ' ')
          # A run Linux waits for shows even before this commit has it, such as quit.
          for run in $(printf '%s\n' "$LINUX_SKIPS" | sed -n 's/^\([a-z-]*\): .*/\1/p'); do
            case " $all " in *" $run "*) ;; *) all="$all $run" ;; esac
          done
          # A run that sets BROWSER_DRIVE sends input through the app's test driver.
          driven() { [ ! -e "check/$1.sh" ] || grep -q BROWSER_DRIVE "check/$1.sh"; }
          case $RUNS in
          '') runs=$LINUX_RUNS; for run in $all; do driven "$run" || runs="$runs $run"; done ;;
          all) runs=$all ;;
          *) runs=$RUNS ;;
          esac
          # check.sh and its runs know Linux, and the app has a driver there, only once
          # feat/linux-drive-2 is in.
          linux=
          grep -q Linux check.sh && linux=1
          driver=
          ls platform/linux/drive.* > /dev/null 2>&1 && driver=1
          {
            [ -z "$driver" ] || printf '%s\n\n' "Under X11, as the Linux driver can't drive Wayland yet."
            echo "| Run | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for run in $all; do
            why=
            if [ -z "$linux" ]; then
              why="check.sh runs only on the Mac in this commit; feat/linux-drive-2 brings it to Linux"
            elif [ -z "$driver" ] && driven "$run"; then
              why="needs the Linux driver (feat/linux-drive-2)"
            fi
            case "$why: $runs " in
            ":"*" $run "*)
              start=$SECONDS
              status=0
              timeout 20m ./check.sh "$run" > "$out/$run.log" 2>&1 || status=$?
              [ ! -d build/check ] || mv build/check "$out/$run"
              pkill -9 -f "$PWD/build/Browser/" || true
              if [ "$status" = 0 ]; then
                result="passed in $((SECONDS - start)) s"
              else
                result="failed ($status): $(grep -m1 '^FAIL' "$out/$run.log" | cut -c7- | tr '|' '/')"
                failed=1
                echo "::error::The $run run failed. Its log: $run.log in the artifact."
              fi
              ;;
            *)
              reason=${why:-$(printf '%s\n' "$LINUX_SKIPS" | sed -n "s/^$run: //p")}
              result="skipped: ${reason:-not passing on Linux yet}"
              ;;
            esac
            echo "| $run | $result |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      - if: ${{ always() && steps.engine.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
