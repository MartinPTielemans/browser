name: Feature request
description: Something ilo should do, or do differently.
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Before asking, read:

        - [docs/decisions.md](https://github.com/MartinPTielemans/browser/blob/main/docs/decisions.md):
          settled choices. What's off the table stays off: Electron as the product, WebKit or
          Gecko as ilo's engine, and closed source; so do paid features, ads and license checks.
          A decision reopens only with the evidence its "Revisit" line names.
        - [docs/ux-principles.md](https://github.com/MartinPTielemans/browser/blob/main/docs/ux-principles.md):
          the principles behind ilo's design, which decide anything new.

        Asking for something isn't asking for a PR. Agree on direction here first (CONTRIBUTING.md).

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I read docs/decisions.md, and this doesn't reopen a settled decision without the evidence it asks for.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do and what gets in the way. The problem, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: elsewhere
    attributes:
      label: Another browser
      description: How another browser handles it, if one does. A public video or recording beats a description, since motion and timing matter.

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What ilo should do, and which of ux-principles.md's principles it follows.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including what you do today.
